<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Super Comments</title>
  <style>
    /* --- Reset & Base --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #ff3c3c;
      --red-dark: #c50000;
      --bg: #0f0f0f;
      --bg2: #1a1a1a;
      --bg3: #242424;
      --border: rgba(255,255,255,0.08);
      --text: #e8e8e8;
      --text-muted: rgba(255,255,255,0.45);
      --radius: 12px;
    }

    body {
      width: 360px;
      min-height: 200px;
      max-height: 560px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- Header --- */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .header-title {
      flex: 1;
    }

    .header-title h1 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.2px;
      line-height: 1;
    }

    .header-title p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Toggle Switch */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .toggle {
      position: relative;
      width: 38px;
      height: 22px;
      cursor: pointer;
    }

    .toggle input { display: none; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--bg3);
      border-radius: 22px;
      border: 1px solid var(--border);
      transition: background 0.25s;
    }

    .toggle input:checked + .toggle-track {
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      border-color: transparent;
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: left 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .toggle input:checked ~ .toggle-thumb {
      left: calc(100% - 19px);
    }

    /* --- Status Banner --- */
    #status-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.active { background: #4caf50; box-shadow: 0 0 6px rgba(76,175,80,0.5); }
    .status-dot.inactive { background: #f44336; }
    .status-dot.idle { background: #ff9800; }

    .status-text {
      flex: 1;
      font-size: 12px;
      color: var(--text-muted);
    }

    .comment-count {
      font-size: 11px;
      font-weight: 700;
      color: var(--red);
      background: rgba(255,60,60,0.1);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255,60,60,0.2);
    }

    /* --- Settings Strip --- */
    .settings-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .settings-strip label {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .duration-select {
      flex: 1;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      outline: none;
    }

    .duration-select:focus {
      border-color: rgba(255,60,60,0.5);
    }

    /* --- Comment List --- */
    .comment-list-header {
      padding: 10px 18px 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      flex-shrink: 0;
    }

    #comment-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #comment-list::-webkit-scrollbar { width: 4px; }
    #comment-list::-webkit-scrollbar-track { background: transparent; }
    #comment-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }

    .comment-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }

    .comment-item:hover {
      background: var(--bg3);
      border-color: rgba(255,60,60,0.35);
      transform: translateX(3px);
    }

    .comment-item:active {
      transform: translateX(1px);
    }

    .item-badge {
      flex-shrink: 0;
      padding: 3px 8px;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      color: #fff;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(255,60,60,0.35);
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-author {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-text {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .item-arrow {
      flex-shrink: 0;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      align-self: center;
      transition: color 0.2s;
    }

    .comment-item:hover .item-arrow {
      color: var(--red);
    }

    /* --- Empty State --- */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 32px 20px;
      text-align: center;
    }

    .empty-state-icon {
      font-size: 36px;
      opacity: 0.35;
    }

    .empty-state-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.5);
    }

    .empty-state-subtitle {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* --- Footer --- */
    .footer {
      padding: 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .footer-version {
      font-size: 10px;
      color: rgba(255,255,255,0.2);
    }

    .footer-btn {
      font-size: 11px;
      color: var(--red);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .footer-btn:hover { opacity: 0.75; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img src="icons/icon48.png" alt="Ícone" class="header-icon" />
    <div class="header-title">
      <h1>YT Super Comments</h1>
      <p id="video-label">Nenhum vídeo detectado</p>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label">Ativo</span>
      <label class="toggle" title="Ativar / Desativar">
        <input type="checkbox" id="enable-toggle" checked />
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
  </div>

  <!-- Status -->
  <div id="status-banner">
    <div class="status-dot idle" id="status-dot"></div>
    <span class="status-text" id="status-text">Aguardando vídeo...</span>
    <span class="comment-count" id="comment-count">0 comentários</span>
  </div>

  <!-- Settings -->
  <div class="settings-strip">
    <label for="duration-select">⏱ Duração:</label>
    <select id="duration-select" class="duration-select">
      <option value="4000">4 segundos</option>
      <option value="6000" selected>6 segundos</option>
      <option value="8000">8 segundos</option>
      <option value="12000">12 segundos</option>
      <option value="20000">20 segundos</option>
    </select>
  </div>

  <!-- List -->
  <div class="comment-list-header">Comentários com timestamps</div>
  <div id="comment-list">
    <div class="empty-state">
      <div class="empty-state-icon">💬</div>
      <div class="empty-state-title">Nenhum comentário encontrado</div>
      <div class="empty-state-subtitle">Abra um vídeo do YouTube e aguarde os<br>comentários carregarem na página.</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-version">v1.0.0</span>
    <button class="footer-btn" id="refresh-btn">↻ Atualizar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
