<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Super Comments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:       #7c5cff;
      --accent-light: #a78bfa;
      --accent-dim:   rgba(124, 92, 255, 0.18);
      --accent-border:rgba(124, 92, 255, 0.35);
      --bg:    #0c0c14;
      --bg2:   #13131f;
      --bg3:   #1c1c2e;
      --bg4:   #23233a;
      --border:rgba(255,255,255,0.07);
      --text:  #e2e2f0;
      --muted: rgba(255,255,255,0.42);
      --radius:12px;
    }

    body {
      width: 360px;
      min-height: 200px;
      max-height: 560px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .header-info { flex: 1; min-width: 0; }

    .header-info h1 {
      font-size: 13.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-info p {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Toggle */
    .toggle-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .toggle-wrap span {
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
      cursor: pointer;
    }
    .toggle input { display: none; }

    .t-track {
      position: absolute;
      inset: 0;
      background: var(--bg4);
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: background 0.22s, border-color 0.22s;
    }
    .toggle input:checked + .t-track {
      background: var(--accent);
      border-color: transparent;
    }

    .t-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
      transition: left 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .toggle input:checked ~ .t-thumb { left: calc(100% - 18px); }

    /* ── Status ─────────────────────────────────── */
    #status-bar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .dot.active  { background: #4ade80; box-shadow: 0 0 7px rgba(74,222,128,0.45); }
    .dot.inactive{ background: #f87171; }
    .dot.idle    { background: #fbbf24; }

    #status-text { flex: 1; font-size: 11.5px; color: var(--muted); }

    .count-badge {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--accent-light);
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      padding: 2px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* ── Settings ───────────────────────────────── */
    .settings {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .settings label {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    .settings select {
      flex: 1;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .settings select:focus { border-color: var(--accent-border); }

    /* ── List header ─────────────────────────────── */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 16px 5px;
      flex-shrink: 0;
    }

    .list-header-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.9px;
    }

    /* ── Comment list ─────────────────────────────── */
    #comment-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #comment-list::-webkit-scrollbar { width: 3px; }
    #comment-list::-webkit-scrollbar-track { background: transparent; }
    #comment-list::-webkit-scrollbar-thumb {
      background: rgba(124,92,255,0.25);
      border-radius: 3px;
    }

    .c-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, transform 0.15s;
      text-decoration: none;
    }

    .c-item:hover {
      background: var(--bg3);
      border-color: var(--accent-border);
      transform: translateX(4px);
    }

    .c-item:active { transform: translateX(2px); }

    /* Time pill */
    .c-time {
      flex-shrink: 0;
      min-width: 44px;
      text-align: center;
      padding: 3px 7px;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent-light);
      white-space: nowrap;
    }

    .c-body { flex: 1; min-width: 0; }

    .c-author {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.82);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-text {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .c-arrow {
      flex-shrink: 0;
      font-size: 13px;
      color: rgba(255,255,255,0.15);
      transition: color 0.2s;
    }
    .c-item:hover .c-arrow { color: var(--accent-light); }

    /* ── Empty state ─────────────────────────────── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      padding: 30px 20px;
      text-align: center;
    }
    .empty-icon  { font-size: 34px; opacity: 0.28; }
    .empty-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.45); }
    .empty-sub   { font-size: 11.5px; color: var(--muted); line-height: 1.5; }

    /* ── Footer ──────────────────────────────────── */
    .footer {
      padding: 7px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .footer-ver { font-size: 10px; color: rgba(255,255,255,0.18); }

    .footer-btn {
      font-size: 11px;
      color: var(--accent-light);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      transition: opacity 0.2s;
    }
    .footer-btn:hover { opacity: 0.7; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img src="icons/icon48.png" alt="Ícone" class="header-icon" />
    <div class="header-info">
      <h1>YT Super Comments</h1>
      <p id="video-label">Nenhum vídeo detectado</p>
    </div>
    <div class="toggle-wrap">
      <span>Ativo</span>
      <label class="toggle" title="Ativar / Desativar">
        <input type="checkbox" id="enable-toggle" checked />
        <div class="t-track"></div>
        <div class="t-thumb"></div>
      </label>
    </div>
  </div>

  <!-- Status bar -->
  <div id="status-bar">
    <div class="dot idle" id="status-dot"></div>
    <span id="status-text">Aguardando vídeo...</span>
    <span class="count-badge" id="comment-count">0 comentários</span>
  </div>

  <!-- Settings -->
  <div class="settings">
    <label for="dur">⏱ Duração:</label>
    <select id="dur">
      <option value="4000">4 segundos</option>
      <option value="6000" selected>6 segundos</option>
      <option value="8000">8 segundos</option>
      <option value="12000">12 segundos</option>
      <option value="20000">20 segundos</option>
    </select>
  </div>

  <!-- List -->
  <div class="list-header">
    <span class="list-header-label">Comentários com timestamps</span>
  </div>
  <div id="comment-list">
    <div class="empty">
      <div class="empty-icon">💬</div>
      <div class="empty-title">Nenhum comentário encontrado</div>
      <div class="empty-sub">Abra um vídeo do YouTube e aguarde<br>os comentários serem carregados.</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-ver">v1.3.0</span>
    <button class="footer-btn" id="refresh-btn">↻ Atualizar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
